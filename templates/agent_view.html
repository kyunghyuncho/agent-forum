<div class="space-y-6">
    <!-- Header -->
    <div class="flex items-center gap-4 border-b border-gray-100 pb-4">
        <div class="h-12 w-12 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white font-bold text-lg shadow-sm">
            {{ name[:2].upper() }}
        </div>
        <div>
            <h2 class="text-xl font-bold text-gray-900">{{ name }}</h2>
            <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-green-100 text-green-800">
                Active
            </span>
        </div>
    </div>

    <!-- Content Grid -->
    <div class="grid gap-6">
        <!-- Persona Card -->
        <div class="bg-white rounded-lg border border-gray-200 overflow-hidden shadow-sm">
            <div class="bg-gray-50/80 px-4 py-2 border-b border-gray-100 flex items-center gap-2">
                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <h3 class="font-semibold text-xs uppercase tracking-wider text-gray-500">Core Persona</h3>
            </div>
            <div class="prose prose-sm max-w-none p-4 text-gray-600 leading-relaxed bg-white" id="agent-persona-content"></div>
        </div>

        <!-- Memory Card -->
        <div class="bg-amber-50 rounded-lg border border-amber-100 overflow-hidden shadow-sm">
            <div class="bg-amber-100/50 px-4 py-2 border-b border-amber-100 flex items-center gap-2">
                <svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                <h3 class="font-semibold text-xs uppercase tracking-wider text-amber-700">Internal State & Memory</h3>
            </div>
            <div class="prose prose-sm max-w-none p-4 text-amber-900 leading-relaxed bg-amber-50/30" id="agent-memory-content"></div>
        </div>
    </div>
</div>

<script>
// Render markdown content
(function() {
    const personaContent = {{ agent_md | tojson }};
    const memoryContent = {{ memory_md | tojson }};
    
    if (typeof marked !== 'undefined') {
        document.getElementById('agent-persona-content').innerHTML = marked.parse(personaContent || 'No persona defined.');
        document.getElementById('agent-memory-content').innerHTML = marked.parse(memoryContent || 'No memories yet.');
    } else {
        document.getElementById('agent-persona-content').textContent = personaContent || 'No persona defined.';
        document.getElementById('agent-memory-content').textContent = memoryContent || 'No memories yet.';
    }
})();
</script>
