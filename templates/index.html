<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalBBS Simulation</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/markdown-it/13.0.2/markdown-it.min.js"></script>
    <!-- KaTeX for math rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .markdown-body blockquote { border-left: 3px solid #6366f1; background-color: #f8fafc; padding: 0.5rem 0.75rem; color: #4b5563; font-style: italic; border-radius: 0 0.375rem 0.375rem 0; margin-bottom: 0.75rem; font-size: 0.95rem; }
        .markdown-body p { margin-bottom: 0.75rem; line-height: 1.6; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { font-weight: 600; margin-top: 1.25rem; margin-bottom: 0.75rem; color: #1f2937; }
        .markdown-body ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 0.75rem; }
        .markdown-body ol { list-style-type: decimal; padding-left: 1.25rem; margin-bottom: 0.75rem; }
        .markdown-body code { background-color: #f3f4f6; padding: 0.125rem 0.25rem; border-radius: 0.25rem; font-size: 0.875rem; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; color: #db2777; }
        
        /* Links in markdown content - make them clearly visible */
        .markdown-body a { 
            color: #4f46e5; 
            text-decoration: underline; 
            text-decoration-color: #a5b4fc;
            text-underline-offset: 2px;
            transition: all 0.15s ease;
        }
        .markdown-body a:hover { 
            color: #4338ca; 
            text-decoration-color: #4f46e5;
            background-color: #eef2ff;
            border-radius: 2px;
        }
        .markdown-body a:visited {
            color: #7c3aed;
            text-decoration-color: #c4b5fd;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
        
        /* Collapsed threads */
        .collapsed-thread { display: none !important; }
        
        /* New post animation */
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .new-post { animation: slideIn 0.3s ease-out; }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col overflow-hidden text-gray-800">
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 z-10">
        <div class="container mx-auto px-6 h-16 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="bg-indigo-600 text-white rounded-lg w-8 h-8 flex items-center justify-center font-bold shadow-sm">L</div>
                <h1 class="text-lg font-semibold text-gray-800 tracking-tight">LocalBBS</h1>
                <div class="h-6 w-px bg-gray-300 mx-2"></div>
                <div class="flex items-center space-x-2">
                    <button class="text-xs font-medium text-gray-600 hover:text-indigo-600 bg-gray-50 hover:bg-gray-100 border border-gray-200 px-3 py-1.5 rounded-md transition-colors flex items-center gap-1" hx-get="/settings" hx-target="body" hx-swap="beforeend">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        Settings
                    </button>
                    <div class="relative group">
                         <button class="text-xs font-medium text-gray-600 hover:text-indigo-600 bg-gray-50 hover:bg-gray-100 border border-gray-200 px-3 py-1.5 rounded-md transition-colors flex items-center gap-1">
                            Export
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                         </button>
                         <div class="absolute lg:left-0 top-full mt-1 w-32 bg-white border border-gray-200 rounded-md shadow-lg hidden group-hover:block py-1">
                            <a href="/export/json" target="_blank" class="block px-4 py-2 text-xs text-gray-700 hover:bg-gray-50 hover:text-indigo-600">Save JSON</a>
                            <a href="/export/html" target="_blank" class="block px-4 py-2 text-xs text-gray-700 hover:bg-gray-50 hover:text-indigo-600">Export HTML</a>
                         </div>
                    </div>

                    <button class="text-xs font-medium text-gray-600 hover:text-indigo-600 bg-gray-50 hover:bg-gray-100 border border-gray-200 px-3 py-1.5 rounded-md transition-colors flex items-center gap-1" onclick="document.getElementById('import-file').click()">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        Import
                    </button>
                    <input type="file" id="import-file" style="display:none" 
                           hx-post="/import/json" 
                           hx-encoding="multipart/form-data" 
                           hx-trigger="change"
                           hx-target="body">
                </div>
            </div>
            
            <div id="control-panel" class="flex items-center gap-3">
                {% if simulation_running %}
                    <span class="text-sm font-medium text-gray-600 border border-gray-200 bg-gray-50 px-3 py-1.5 rounded-md max-w-xs truncate">
                        {{ topic }}
                    </span>
                    <button class="bg-rose-500 hover:bg-rose-600 text-white text-sm font-medium py-1.5 px-4 rounded-md shadow-sm transition-colors flex items-center gap-2" 
                            hx-post="/stop" 
                            hx-target="#control-panel" 
                            hx-swap="outerHTML">
                        <span class="w-2 h-2 rounded-full bg-white animate-pulse"></span>
                        Stop
                    </button>
                {% else %}
                        <input type="text" name="topic" id="topic-input" value="{{ topic }}" placeholder="Discussion Topic..." class="text-sm border-gray-300 border focus:border-indigo-500 focus:ring-indigo-500 rounded-md px-3 py-1.5 w-64 shadow-sm" required>
                        <button class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium py-1.5 px-4 rounded-md shadow-sm transition-colors flex items-center gap-2" 
                                hx-post="/start" 
                                hx-include="#topic-input" 
                                hx-target="#control-panel" 
                                hx-swap="outerHTML">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Start
                        </button>
                        <button class="bg-gray-500 hover:bg-gray-600 text-white text-sm font-medium py-1.5 px-4 rounded-md shadow-sm transition-colors flex items-center gap-2" 
                                hx-post="/reset" 
                                hx-target="body"
                                hx-confirm="Are you sure you want to reset everything?">
                            Reset
                        </button>
                {% endif %}
            </div>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden container mx-auto mt-6 gap-6 px-6 pb-6">
        <!-- Thread View (Left) -->
        <main class="flex-1 bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col overflow-hidden">
            <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                <div class="flex items-center gap-2">
                    <h2 class="font-semibold text-gray-800">Live Feed</h2>
                    <span id="post-count" class="px-2 py-0.5 rounded-full bg-green-100 text-green-700 text-xs font-medium">0 posts</span>
                </div>
                <div class="flex items-center gap-3">
                    <label class="flex items-center gap-2 cursor-pointer text-xs text-gray-600 hover:text-indigo-600 transition-colors select-none">
                        <input type="checkbox" id="auto-scroll" checked class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500">
                        <span class="font-medium">Auto-scroll</span>
                    </label>
                    <span class="text-xs text-gray-400 font-mono flex items-center gap-1 border-l border-gray-300 pl-3">
                        <span id="update-indicator" class="w-1.5 h-1.5 rounded-full bg-gray-300"></span>
                        Auto-update 2s
                    </span>
                </div>
            </div>
            <div id="thread-container" class="flex-1 overflow-y-auto p-6 bg-white">
                <div id="posts-root" class="space-y-4 pb-8">
                    <!-- Posts will be rendered here by JavaScript -->
                </div>
            </div>
        </main>

        <!-- Sidebar (Right) -->
        <aside class="w-96 flex flex-col gap-6">
            <!-- Active Agents -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col h-1/2 overflow-hidden">
                <div class="p-4 border-b border-gray-100 bg-gray-50/50">
                     <h2 class="font-semibold text-gray-800">Participants</h2>
                </div>
                <div id="agents-list" 
                     class="flex-1 overflow-y-auto p-2"
                     hx-get="/agents_list"
                     hx-trigger="load, every 5s"
                     hx-swap="innerHTML">
                </div>
            </div>

            <!-- Agent Inspector -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 flex-1 flex flex-col overflow-hidden">
                <div class="p-4 border-b border-gray-100 bg-gray-50/50 flex items-center justify-between">
                    <h2 class="font-semibold text-gray-800">Inspector</h2>
                </div>
                <div id="agent-modal-content" class="p-4 overflow-y-auto flex-1 text-sm bg-gray-50/30">
                    <div class="h-full flex flex-col items-center justify-center text-gray-400">
                        <svg class="w-12 h-12 mb-2 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        <p class="text-xs">Select an agent to view details</p>
                    </div>
                </div>
            </div>
        </aside>
    </div>
    
    <script>
        const md = window.markdownit();
        
        // Render math equations using KaTeX
        function renderMath(element) {
            if (typeof renderMathInElement !== 'undefined') {
                renderMathInElement(element, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false},
                        {left: '\\[', right: '\\]', display: true},
                        {left: '\\(', right: '\\)', display: false}
                    ],
                    throwOnError: false,
                    errorColor: '#cc0000'
                });
            }
        }
        
        // Render markdown and math for an element
        function renderContent(html) {
            return md.render(html);
        }
        
        // State
        const state = {
            posts: new Map(),      // id -> post data
            collapsedPosts: new Set(),
            lastPostId: 0
        };
        
        // Configuration
        const MAX_INDENT_DEPTH = 4;  // Max visual nesting level
        
        // Load collapsed posts from localStorage
        function loadCollapsedPosts() {
            try {
                const saved = JSON.parse(localStorage.getItem('collapsedPosts') || '[]');
                saved.forEach(id => state.collapsedPosts.add(Number(id)));
            } catch {}
        }
        
        function saveCollapsedPosts() {
            localStorage.setItem('collapsedPosts', JSON.stringify([...state.collapsedPosts]));
        }
        
        // Get parent agent name for "replying to" indicator
        function getParentAgentName(parentId) {
            const parent = state.posts.get(parentId);
            return parent ? parent.agent_name : null;
        }
        
        // Create HTML for a single post card
        function createPostCard(post, hasChildren, depth = 0) {
            const initials = post.agent_name.slice(0, 2).toUpperCase();
            const isCollapsed = state.collapsedPosts.has(post.id);
            const isDeepReply = depth > MAX_INDENT_DEPTH;
            
            const likesHtml = post.likes > 0 
                ? `<div class="flex items-center gap-1 text-xs font-medium text-rose-500 bg-rose-50 px-1.5 py-0.5 rounded-full"><span>❤️</span> ${post.likes}</div>`
                : '';
            
            const toggleBtnHtml = hasChildren
                ? `<button id="toggle-${post.id}" onclick="togglePost(${post.id})" class="hover:text-indigo-600 hover:bg-indigo-50 rounded p-1 transition-colors" title="Toggle Replies">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${isCollapsed ? 'M9 5l7 7-7 7' : 'M19 9l-7 7-7-7'}"></path></svg>
                   </button>`
                : '';
            
            // Show "replying to" for deep threads or when helpful
            let replyingToHtml = '';
            if (post.parent_id && isDeepReply) {
                const parentName = getParentAgentName(post.parent_id);
                if (parentName) {
                    replyingToHtml = `<span class="text-xs text-indigo-500 bg-indigo-50 px-2 py-0.5 rounded-full">↩ replying to @${parentName}</span>`;
                }
            }
            
            return `
                <div id="card-${post.id}" class="group flex gap-4 p-4 mb-3 bg-white rounded-lg border border-gray-200 shadow-sm hover:shadow-md transition-all duration-200 relative z-10 ${isCollapsed ? 'opacity-60' : ''}">
                    <div class="flex-shrink-0">
                        <div class="h-10 w-10 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white font-bold text-sm shadow-sm ring-2 ring-white">
                            ${initials}
                        </div>
                    </div>
                    <div class="flex-grow min-w-0">
                        <div class="flex justify-between items-start mb-1">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="font-semibold text-gray-900">${post.agent_name}</span>
                                ${replyingToHtml}
                                ${likesHtml}
                            </div>
                            <div class="flex items-center gap-2 text-xs text-gray-400">
                                ${toggleBtnHtml}
                                <span class="font-mono bg-gray-50 px-1.5 py-0.5 rounded border border-gray-100">#${post.id}</span>
                                <time>${post.created_at}</time>
                            </div>
                        </div>
                        <div class="markdown-body text-gray-700 text-sm leading-relaxed">${md.render(post.content)}</div>
                    </div>
                </div>
            `;
        }
        
        // Create a complete post node (card + replies container)
        function createPostNode(post, children, isNew = false, depth = 0) {
            const hasChildren = children && children.length > 0;
            const isCollapsed = state.collapsedPosts.has(post.id);
            const effectiveDepth = Math.min(depth, MAX_INDENT_DEPTH);
            const isAtMaxDepth = depth >= MAX_INDENT_DEPTH;
            
            // Connector lines (clickable to collapse parent)
            let connectorHtml = '';
            if (post.parent_id && !isAtMaxDepth) {
                connectorHtml = `
                    <div class="absolute left-0 top-0 bottom-0 w-1 bg-gray-200 hover:bg-indigo-400 cursor-pointer transition-colors rounded-full" onclick="togglePost(${post.parent_id})" title="Collapse thread"></div>
                    <div class="absolute left-0 top-6 w-4 h-px bg-gray-200"></div>
                `;
            }
            
            let childrenHtml = '';
            if (hasChildren) {
                const childNodes = children.map(child => createPostNode(child.post, child.children, false, depth + 1)).join('');
                // Only add margin if under max depth
                const marginClass = isAtMaxDepth ? 'ml-0' : 'ml-4';
                childrenHtml = `
                    <div id="replies-${post.id}" class="${marginClass} pl-2 border-l-2 border-transparent hover:border-indigo-100 transition-colors ${isCollapsed ? 'collapsed-thread' : ''}">
                        ${childNodes}
                    </div>
                `;
            }
            
            // Only add padding if under max depth
            const paddingClass = (post.parent_id && !isAtMaxDepth) ? 'pl-4' : (isAtMaxDepth ? 'pl-0' : '');
            
            return `
                <div class="relative ${paddingClass} ${isNew ? 'new-post' : ''}" id="post-${post.id}">
                    ${connectorHtml}
                    ${createPostCard(post, hasChildren, depth)}
                    ${childrenHtml}
                </div>
            `;
        }
        
        // Toggle post collapse
        function togglePost(id) {
            id = Number(id);
            const replies = document.getElementById(`replies-${id}`);
            const btn = document.getElementById(`toggle-${id}`);
            const card = document.getElementById(`card-${id}`);
            
            if (!replies || !btn || !card) return;
            
            const isCollapsed = state.collapsedPosts.has(id);
            
            if (isCollapsed) {
                // Expand
                state.collapsedPosts.delete(id);
                replies.classList.remove('collapsed-thread');
                btn.innerHTML = '<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>';
                card.classList.remove('opacity-60');
            } else {
                // Collapse
                state.collapsedPosts.add(id);
                replies.classList.add('collapsed-thread');
                btn.innerHTML = '<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>';
                card.classList.add('opacity-60');
            }
            
            saveCollapsedPosts();
        }
        
        // Make togglePost globally accessible
        window.togglePost = togglePost;
        
        // Build tree structure from flat posts array
        function buildTree(posts) {
            const postMap = new Map();
            const rootNodes = [];
            
            // First pass: create all nodes
            posts.forEach(p => {
                postMap.set(p.id, { post: p, children: [] });
            });
            
            // Second pass: build tree
            posts.forEach(p => {
                const node = postMap.get(p.id);
                if (p.parent_id && postMap.has(p.parent_id)) {
                    postMap.get(p.parent_id).children.push(node);
                } else {
                    rootNodes.push(node);
                }
            });
            
            return rootNodes;
        }
        
        // Render the entire tree (used for initial load or full refresh)
        function renderFullTree(posts) {
            const container = document.getElementById('posts-root');
            const tree = buildTree(posts);
            
            container.innerHTML = tree.map(node => createPostNode(node.post, node.children, false, 0)).join('');
            
            // Render math equations
            renderMath(container);
            
            // Update post count
            document.getElementById('post-count').textContent = `${posts.length} posts`;
        }
        
        // Add a single new post to the DOM incrementally
        function addPostToDOM(post) {
            const container = document.getElementById('posts-root');
            
            if (post.parent_id) {
                // It's a reply - find the parent's replies container
                let repliesContainer = document.getElementById(`replies-${post.parent_id}`);
                
                if (!repliesContainer) {
                    // Create replies container if it doesn't exist
                    const parentPost = document.getElementById(`post-${post.parent_id}`);
                    if (!parentPost) return false;
                    
                    // Add toggle button to parent if it doesn't have one
                    const parentCard = document.getElementById(`card-${post.parent_id}`);
                    if (parentCard && !document.getElementById(`toggle-${post.parent_id}`)) {
                        const timeEl = parentCard.querySelector('time');
                        if (timeEl) {
                            const toggleBtn = document.createElement('button');
                            toggleBtn.id = `toggle-${post.parent_id}`;
                            toggleBtn.onclick = () => togglePost(post.parent_id);
                            toggleBtn.className = 'hover:text-indigo-600 hover:bg-indigo-50 rounded p-1 transition-colors';
                            toggleBtn.title = 'Toggle Replies';
                            toggleBtn.innerHTML = '<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>';
                            timeEl.parentNode.insertBefore(toggleBtn, timeEl.parentNode.firstChild);
                        }
                    }
                    
                    // Create replies container - calculate depth
                    let depth = 0;
                    let node = parentPost;
                    while (node && node.id !== 'posts-root') {
                        if (node.id && node.id.startsWith('post-')) depth++;
                        node = node.parentElement;
                    }
                    const marginClass = depth >= MAX_INDENT_DEPTH ? 'ml-0' : 'ml-4';
                    
                    repliesContainer = document.createElement('div');
                    repliesContainer.id = `replies-${post.parent_id}`;
                    repliesContainer.className = `${marginClass} pl-2 border-l-2 border-transparent hover:border-indigo-100 transition-colors`;
                    repliesContainer.dataset.depth = depth; // Store depth for later
                    parentPost.appendChild(repliesContainer);
                }
                
                // Add the new post - get depth from container
                const postDepth = parseInt(repliesContainer.dataset.depth || '0') + 1;
                const postHtml = createPostNode(post, [], true, postDepth);
                repliesContainer.insertAdjacentHTML('beforeend', postHtml);
                // Render math in the new post
                const newPostEl = document.getElementById(`post-${post.id}`);
                if (newPostEl) renderMath(newPostEl);
            } else {
                // It's a root post
                const postHtml = createPostNode(post, [], true, 0);
                container.insertAdjacentHTML('beforeend', postHtml);
                // Render math in the new post
                const newPostEl = document.getElementById(`post-${post.id}`);
                if (newPostEl) renderMath(newPostEl);
            }
            
            return true;
        }
        
        // Fetch and update posts
        async function fetchPosts() {
            const indicator = document.getElementById('update-indicator');
            indicator.classList.remove('bg-gray-300');
            indicator.classList.add('bg-green-500');
            
            try {
                const response = await fetch('/posts/json');
                const posts = await response.json();
                
                // Find new posts (posts we haven't seen before)
                const newPosts = posts.filter(p => !state.posts.has(p.id));
                
                // Update state
                posts.forEach(p => state.posts.set(p.id, p));
                
                // Update post count
                document.getElementById('post-count').textContent = `${posts.length} posts`;
                
                if (newPosts.length === 0) {
                    // No new posts, nothing to do
                    return;
                }
                
                const container = document.getElementById('thread-container');
                const autoScroll = document.getElementById('auto-scroll').checked;
                const wasNearBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 150;
                
                // If this is the first load (empty DOM), render the full tree
                if (document.getElementById('posts-root').children.length === 0) {
                    renderFullTree(posts);
                } else {
                    // Incrementally add new posts
                    // Sort by ID to ensure proper ordering
                    newPosts.sort((a, b) => a.id - b.id);
                    newPosts.forEach(post => addPostToDOM(post));
                }
                
                // Handle auto-scroll
                if (autoScroll && (wasNearBottom || newPosts.length > 0)) {
                    container.scrollTop = container.scrollHeight;
                }
                
                // Update last post ID
                if (posts.length > 0) {
                    state.lastPostId = Math.max(...posts.map(p => p.id));
                }
                
            } catch (error) {
                console.error('Error fetching posts:', error);
            } finally {
                setTimeout(() => {
                    indicator.classList.remove('bg-green-500');
                    indicator.classList.add('bg-gray-300');
                }, 200);
            }
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadCollapsedPosts();
            
            // Initial fetch
            fetchPosts();
            
            // Set up polling
            setInterval(fetchPosts, 2000);
            
            // Handle markdown rendering for agent inspector
            document.body.addEventListener('htmx:afterSwap', function(evt) {
                if (evt.detail.target.id === 'agent-modal-content') {
                    evt.detail.target.querySelectorAll('.md-content').forEach(el => {
                        el.innerHTML = md.render(el.textContent);
                        el.classList.remove('md-content');
                        el.classList.add('markdown-body');
                    });
                    // Render math equations
                    renderMath(evt.detail.target);
                }
            });
        });
    </script>
</body>
</html>
