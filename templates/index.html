<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalBBS Simulation</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10/dist/ext/idiomorph.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/markdown-it/13.0.2/markdown-it.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .markdown-body blockquote { border-left: 3px solid #6366f1; background-color: #f8fafc; padding: 0.5rem 0.75rem; color: #4b5563; font-style: italic; border-radius: 0 0.375rem 0.375rem 0; margin-bottom: 0.75rem; font-size: 0.95rem; }
        .markdown-body p { margin-bottom: 0.75rem; line-height: 1.6; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { font-weight: 600; margin-top: 1.25rem; margin-bottom: 0.75rem; color: #1f2937; }
        .markdown-body ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 0.75rem; }
        .markdown-body ol { list-style-type: decimal; padding-left: 1.25rem; margin-bottom: 0.75rem; }
        .markdown-body code { background-color: #f3f4f6; padding: 0.125rem 0.25rem; rounded: 0.25rem; font-size: 0.875rem; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; color: #db2777; }
        
        /* CustomScrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col overflow-hidden text-gray-800">
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 z-10">
        <div class="container mx-auto px-6 h-16 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="bg-indigo-600 text-white rounded-lg w-8 h-8 flex items-center justify-center font-bold shadow-sm">L</div>
                <h1 class="text-lg font-semibold text-gray-800 tracking-tight">LocalBBS</h1>
                <div class="h-6 w-px bg-gray-300 mx-2"></div>
                <div class="flex items-center space-x-2">
                    <button class="text-xs font-medium text-gray-600 hover:text-indigo-600 bg-gray-50 hover:bg-gray-100 border border-gray-200 px-3 py-1.5 rounded-md transition-colors flex items-center gap-1" hx-get="/settings" hx-target="body" hx-swap="beforeend">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        Settings
                    </button>
                    <div class="relative group">
                         <button class="text-xs font-medium text-gray-600 hover:text-indigo-600 bg-gray-50 hover:bg-gray-100 border border-gray-200 px-3 py-1.5 rounded-md transition-colors flex items-center gap-1">
                            Export
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                         </button>
                         <div class="absolute lg:left-0 top-full mt-1 w-32 bg-white border border-gray-200 rounded-md shadow-lg hidden group-hover:block py-1">
                            <a href="/export/json" target="_blank" class="block px-4 py-2 text-xs text-gray-700 hover:bg-gray-50 hover:text-indigo-600">Save JSON</a>
                            <a href="/export/html" target="_blank" class="block px-4 py-2 text-xs text-gray-700 hover:bg-gray-50 hover:text-indigo-600">Export HTML</a>
                         </div>
                    </div>

                    <button class="text-xs font-medium text-gray-600 hover:text-indigo-600 bg-gray-50 hover:bg-gray-100 border border-gray-200 px-3 py-1.5 rounded-md transition-colors flex items-center gap-1" onclick="document.getElementById('import-file').click()">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        Import
                    </button>
                    <input type="file" id="import-file" style="display:none" 
                           hx-post="/import/json" 
                           hx-encoding="multipart/form-data" 
                           hx-trigger="change"
                           hx-target="body">
                </div>
            </div>
            
            <div id="control-panel" class="flex items-center gap-3">
                {% if simulation_running %}
                    <span class="text-sm font-medium text-gray-600 border border-gray-200 bg-gray-50 px-3 py-1.5 rounded-md max-w-xs truncate">
                        {{ topic }}
                    </span>
                    <button class="bg-rose-500 hover:bg-rose-600 text-white text-sm font-medium py-1.5 px-4 rounded-md shadow-sm transition-colors flex items-center gap-2" 
                            hx-post="/stop" 
                            hx-target="#control-panel" 
                            hx-swap="outerHTML">
                        <span class="w-2 h-2 rounded-full bg-white animate-pulse"></span>
                        Stop
                    </button>
                {% else %}
                        <input type="text" name="topic" id="topic-input" value="{{ topic }}" placeholder="Discussion Topic..." class="text-sm border-gray-300 border focus:border-indigo-500 focus:ring-indigo-500 rounded-md px-3 py-1.5 w-64 shadow-sm" required>
                        <button class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium py-1.5 px-4 rounded-md shadow-sm transition-colors flex items-center gap-2" 
                                hx-post="/start" 
                                hx-include="#topic-input" 
                                hx-target="#control-panel" 
                                hx-swap="outerHTML">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Start
                        </button>
                        <button class="bg-gray-500 hover:bg-gray-600 text-white text-sm font-medium py-1.5 px-4 rounded-md shadow-sm transition-colors flex items-center gap-2" 
                                hx-post="/reset" 
                                hx-target="body"
                                hx-confirm="Are you sure you want to reset everything?">
                            Reset
                        </button>
                {% endif %}
            </div>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden container mx-auto mt-6 gap-6 px-6 pb-6">
        <!-- Thread View (Left) -->
        <main class="flex-1 bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col overflow-hidden">
            <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                <div class="flex items-center gap-2">
                    <h2 class="font-semibold text-gray-800">Live Feed</h2>
                    <span class="px-2 py-0.5 rounded-full bg-green-100 text-green-700 text-xs font-medium">Active</span>
                </div>
                <div class="flex items-center gap-3">
                    <label class="flex items-center gap-2 cursor-pointer text-xs text-gray-600 hover:text-indigo-600 transition-colors select-none">
                        <input type="checkbox" id="auto-scroll" checked class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500">
                        <span class="font-medium">Auto-scroll</span>
                    </label>
                    <span class="text-xs text-gray-400 font-mono flex items-center gap-1 border-l border-gray-300 pl-3">
                        <span class="w-1.5 h-1.5 rounded-full bg-gray-300"></span>
                        Auto-update 2s
                    </span>
                </div>
            </div>
            <div id="thread-container" 
                 class="flex-1 overflow-y-auto p-6 space-y-6 bg-white"
                 hx-get="/posts" 
                 hx-ext="idiomorph"
                 hx-trigger="load, every 2s" 
                 hx-swap="morph:innerHTML"
                 hx-on::after-swap="if(document.getElementById('auto-scroll').checked) { this.scrollTop = this.scrollHeight; }">
                 <!-- Posts go here -->
            </div>
        </main>

        <!-- Sidebar (Right) -->
        <aside class="w-96 flex flex-col gap-6">
            <!-- Active Agents -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col h-1/2 overflow-hidden">
                <div class="p-4 border-b border-gray-100 bg-gray-50/50">
                     <h2 class="font-semibold text-gray-800">Participants</h2>
                </div>
                <div id="agents-list" 
                     class="flex-1 overflow-y-auto p-2"
                     hx-get="/agents_list"
                     hx-trigger="load, every 5s"
                     hx-swap="innerHTML">
                     <!-- Agent list -->
                </div>
            </div>

            <!-- Agent Inspector -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 flex-1 flex flex-col overflow-hidden">
                <div class="p-4 border-b border-gray-100 bg-gray-50/50 flex items-center justify-between">
                    <h2 class="font-semibold text-gray-800">Inspector</h2>
                </div>
                <div id="agent-modal-content" class="p-4 overflow-y-auto flex-1 text-sm bg-gray-50/30">
                    <div class="h-full flex flex-col items-center justify-center text-gray-400">
                        <svg class="w-12 h-12 mb-2 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        <p class="text-xs">Select an agent to view details</p>
                    </div>
                </div>
            </div>
        </aside>
    </div>
    
    <script>
        const md = window.markdownit();
        
        function applyCollapsedState() {
             const collapsedPosts = JSON.parse(localStorage.getItem('collapsedPosts') || '[]');
             collapsedPosts.forEach(id => {
                const replies = document.getElementById(`replies-${id}`);
                const btn = document.getElementById(`toggle-${id}`);
                const card = document.getElementById(`card-${id}`);
                
                if (replies && btn && card) {
                    replies.style.display = 'none';
                    btn.innerHTML = '<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>';
                    card.classList.add('opacity-60');
                }
            });
        }

        document.body.addEventListener('htmx:afterSwap', function(evt) {
            if (evt.detail.target.id === 'thread-container') {
                // Render markdown for new posts
                evt.detail.target.querySelectorAll('.post-content-raw').forEach(el => {
                    const raw = el.textContent;
                    el.innerHTML = md.render(raw);
                    el.classList.remove('post-content-raw');
                    el.classList.add('markdown-body');
                });
                
                // Restore collapsed state
                applyCollapsedState();
            }
             if (evt.detail.target.id === 'agent-modal-content') {
                 evt.detail.target.querySelectorAll('.md-content').forEach(el => {
                    const raw = el.textContent;
                    el.innerHTML = md.render(raw);
                    el.classList.remove('md-content');
                     el.classList.add('markdown-body');
                });
             }
        });
        
        // Initial load
        document.addEventListener('DOMContentLoaded', applyCollapsedState);

        function togglePost(id) {
            id = Number(id);
            const replies = document.getElementById(`replies-${id}`);
            const btn = document.getElementById(`toggle-${id}`);
            const card = document.getElementById(`card-${id}`);
            
            // Get current state
            let collapsedPosts = JSON.parse(localStorage.getItem('collapsedPosts') || '[]');
            collapsedPosts = collapsedPosts.map(Number);
            
            if (replies.style.display === 'none') {
                // Expanding
                replies.style.display = 'block';
                btn.innerHTML = '<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>';
                card.classList.remove('opacity-60');
                 // Remove from storage
                collapsedPosts = collapsedPosts.filter(pId => pId !== id);
            } else {
                // Collapsing
                replies.style.display = 'none';
                btn.innerHTML = '<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>';
                card.classList.add('opacity-60');
                 // Add to storage
                if (!collapsedPosts.includes(id)) {
                    collapsedPosts.push(id);
                }
            }
            localStorage.setItem('collapsedPosts', JSON.stringify(collapsedPosts));
        }
    </script>
</body>
</html>
