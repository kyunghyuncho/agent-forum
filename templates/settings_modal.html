<div class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50" id="settings-modal">
    <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-bold">Settings</h3>
            <button class="text-black close-modal" onclick="document.getElementById('settings-modal').remove()">
                &times;
            </button>
        </div>
        
        <form hx-post="/settings" hx-target="#settings-response">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">OpenRouter API Key</label>
                <input type="password" name="api_key" value="{{ settings.OPENROUTER_API_KEY }}" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="sk-or-...">
                <p class="text-xs text-gray-500 mt-1">Get your key from <a href="https://openrouter.ai/keys" target="_blank" class="text-blue-500 hover:underline">openrouter.ai/keys</a></p>
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Model Name</label>
                <input type="text" name="model_name" value="{{ settings.MODEL_NAME }}" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                <p class="text-xs text-gray-500 mt-1">e.g. openai/gpt-3.5-turbo, anthropic/claude-3-haiku</p>
            </div>
            
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Initial Agent Count</label>
                <input type="number" name="agent_count" value="{{ settings.DEFAULT_AGENT_COUNT }}" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Agent Pool Style</label>
                <select name="agent_pool_style" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                    <option value="professional" {% if settings.AGENT_POOL_STYLE == 'professional' %}selected{% endif %}>Professional - Experts, analysts, researchers</option>
                    <option value="creative" {% if settings.AGENT_POOL_STYLE == 'creative' %}selected{% endif %}>Creative - Writers, philosophers, visionaries</option>
                    <option value="fun" {% if settings.AGENT_POOL_STYLE == 'fun' %}selected{% endif %}>Fun - Witty, humorous, chaotic personalities</option>
                </select>
                <p class="text-xs text-gray-500 mt-1">Affects how MOTHER creates agents when starting a new topic.</p>
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Max Loops</label>
                <input type="number" name="max_loops" value="{{ settings.MAX_LOOPS }}" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Loop Delay (seconds)</label>
                <input type="number" step="0.1" name="loop_delay" value="{{ settings.LOOP_DELAY }}" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700">
            </div>

            <div class="mb-4">
                <label class="flex items-center">
                    <input type="checkbox" name="enable_web_browse" value="true" {% if settings.ENABLE_WEB_BROWSE %}checked{% endif %} class="mr-2">
                    <span class="text-gray-700 text-sm font-bold">Enable Web Browsing</span>
                </label>
                <p class="text-xs text-gray-500 mt-1">Allow agents to fetch pages from Wikipedia, arXiv, PubMed, and other trusted sources.</p>
            </div>

            <div id="settings-response" class="mb-4"></div>

            <div class="flex justify-end">
                <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
